version: "3"

run: once

env:
  DOTFILES_DIR:
    sh: |
      if [ -z "$DOTFILES_DIR" ]; then
        echo "Error: DOTFILES_DIR environment variable is not set" >&2
        exit 1
      fi

tasks:
  atuin-login:
    desc: Login with Atuin
    cmds:
      - atuin login -u vl-cr

  brew:
    desc: Install Brew bundle from dotfiles
    dir: $DOTFILES_DIR/setup
    cmds:
      - brew bundle install
      - brew cleanup

  casks:
    desc: Install Brew casks from dotfiles
    dir: $DOTFILES_DIR/setup
    cmds:
      - brew bundle install --file=Brewfile-casks
      - brew cleanup
      - |
        if [ ! -f "$FIREFOX_CONFIG_PATH/Profiles/vl-cr/times.json" ]; then
          firefox -P
        fi

  rosetta:
    desc: Install Rosetta on Apple Silicon Macs
    platforms: [darwin]
    cmds:
      - |
        if [ "$(uname -m)" != "arm64" ]; then
          echo "Rosetta is only needed on Apple Silicon Macs."
        elif pkgutil --pkg-info com.apple.pkg.RosettaUpdateAuto >/dev/null 2>&1; then
          echo "Rosetta is already installed."
        else
          sudo softwareupdate --install-rosetta --agree-to-license
        fi

  snaps:
    desc: Install snaps for Ubuntu Desktop from dotfiles
    dir: $DOTFILES_DIR/setup
    cmds:
      - bash snaps.sh
      - |
        if [ ! -f "$FIREFOX_CONFIG_PATH/Profiles/vl-cr/times.json" ]; then
          firefox -P
        fi

  skills-install:
    desc: Install skills listed in setup/skills.txt
    silent: true
    cmds:
      - |
        grep -Ev '^[[:space:]]*(#|$)' "$DOTFILES_DIR/setup/skills.txt" |
          xargs -L 1 sh -c 'npx -y skills add "$@" -a codex -g -y' _

  skills-update:
    desc: Update skills installed with the skills CLI
    cmds:
      - npx -y skills update -g -y
