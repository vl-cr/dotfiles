version: "3"

run: once

env:
  DOTFILES_DIR:
    sh: |
      if [ -z "$DOTFILES_DIR" ]; then
        echo "Error: DOTFILES_DIR environment variable is not set" >&2
        exit 1
      fi

tasks:
  setup-ssh-keys:
    desc: Generate personal and work Ed25519 SSH keys without passphrases
    cmds:
      - |
        set -eu
        SSH_KEYS_DIR="${SSH_KEYS_DIR:-$HOME/.ssh}"
        mkdir -p -m 700 "$SSH_KEYS_DIR"
        for SSH_KEY_NAME in ssh_key_personal ssh_key_work; do
          SSH_KEY_PATH="$SSH_KEYS_DIR/$SSH_KEY_NAME"
          if [ -e "$SSH_KEY_PATH" ] || [ -L "$SSH_KEY_PATH" ] || [ -e "$SSH_KEY_PATH.pub" ] || [ -L "$SSH_KEY_PATH.pub" ]; then
            echo "Keeping existing key files: $SSH_KEY_PATH"
            continue
          fi
          ssh-keygen -t ed25519 -N '' -C "$SSH_KEY_NAME" -f "$SSH_KEY_PATH"
        done

  setup-atuin:
    desc: Log in to Atuin (one-off setup)
    cmds:
      - atuin login -u vl-cr

  setup-firefox:
    desc: Install and configure Firefox on macOS or Ubuntu Desktop (one-off setup)
    platforms: [darwin, linux]
    cmds:
      - |
        set -eu
        case "{{OS}}" in
          darwin)
            brew install --cask firefox
            firefox_config_path="$HOME/Library/Application Support/Firefox"
            ;;
          linux)
            sudo snap install firefox
            firefox_config_path="$HOME/snap/firefox/common/.mozilla/firefox"
            ;;
        esac

        mkdir -p "$firefox_config_path/Profiles/vl-cr/chrome"
        ln -sf "$DOTFILES_DIR/config/firefox/user.js" "$firefox_config_path/Profiles/vl-cr/user.js"
        ln -sf "$DOTFILES_DIR/config/firefox/userChrome.css" "$firefox_config_path/Profiles/vl-cr/chrome/userChrome.css"
        ln -sf "$DOTFILES_DIR/config/firefox/installs.ini" "$firefox_config_path/installs.ini"
        ln -sf "$DOTFILES_DIR/config/firefox/profiles.ini" "$firefox_config_path/profiles.ini"

        if [ ! -f "$firefox_config_path/Profiles/vl-cr/times.json" ]; then
          firefox -P
        fi

  brew:
    desc: Install Brew bundle from dotfiles
    dir: $DOTFILES_DIR/setup
    cmds:
      - brew bundle install

  casks:
    desc: Install Brew casks from dotfiles
    dir: $DOTFILES_DIR/setup
    cmds:
      - brew bundle install --file=Brewfile-casks

  rosetta:
    desc: Install Rosetta on Apple Silicon Macs
    platforms: [darwin]
    cmds:
      - |
        if [ "$(uname -m)" != "arm64" ]; then
          echo "Rosetta is only needed on Apple Silicon Macs."
        elif pkgutil --pkg-info com.apple.pkg.RosettaUpdateAuto >/dev/null 2>&1; then
          echo "Rosetta is already installed."
        else
          sudo softwareupdate --install-rosetta --agree-to-license
        fi

  snaps:
    desc: Install snaps for Ubuntu Desktop from dotfiles
    dir: $DOTFILES_DIR/setup
    cmds:
      - bash snaps.sh

  skills-install:
    desc: Install skills listed in setup/skills.txt
    silent: true
    cmds:
      - |
        grep -Ev '^[[:space:]]*(#|$)' "$DOTFILES_DIR/setup/skills.txt" |
          xargs -L 1 sh -c 'npx -y skills add "$@" -a codex -g -y' _

  skills-update:
    desc: Update skills installed with the skills CLI
    cmds:
      - npx -y skills update -g -y
