prompt = "Run the daily Homebrew review for /Users/vl-cr/Documents/dotfiles.\n\nScope: Homebrew itself and formulae only. Casks are excluded from installation, upgrades, inventories, release research and reports.\n\nDeliver the report IN THIS RUN'S CODEX TASK as the final Markdown response, using the three exact headings below. Never create or link a report file. Scheduler memory.md is a short operational checkpoint, not the report. These instructions supersede older execution behaviour, report formats and significance thresholds in memory.\n\nPrepare → run the helper once → compare → investigate affected tools → checkpoint → report here.\n\nCommand work\nRead applicable $CODEX_HOME/AGENTS.md guidance (config/codex/AGENTS.md here), relevant topic guides and short automation memory. Batch necessary reads. Inspect the brew task in Taskfile.yaml and setup/Brewfile; inspect other wiring only when changed or relevant to a failure. Parse saved JSON in code and expose only phase, pending ranges and outstanding findings needed for this run; never dump full current.json, inventories or research history.\n\nInvoke python3 config/codex/scripts/homebrew_update.py from this checkout. Reuse this checked-in helper; do not generate runners, parsers, tests or documentation during routine runs. It validates all installed formulae and Homebrew's version → runs task -g brew → runs brew cleanup → captures after versions. The shared before/after formula inventory includes dependencies and packages outside setup/Brewfile.\n\nThe user authorises these daily formula installs, upgrades and cleanup. Updates must never ask for a password or wait for user input. Keep the helper's noninteractive process settings: stdin closed, no controlling terminal and a failing SUDO_ASKPASS helper. If authentication is required, let the command fail promptly and diagnose the saved error. A failed formula task stops subsequent update steps.\n\nDo not run cask commands, force-quit apps, use greedy/force flags, run unrelated upgrades or run install.sh. Do not request/store passwords, run sudo brew, repair ownership or change managed policies/authentication settings. After a password/permission failure, inspect only the relevant error and affected path, owner, group and mode; explain the required manual action. Do not infer ownership from sandbox-sensitive os.access results.\n\nInspect the compact helper JSON: update_steps, update_exit_code, changes, pending_review and state/log paths. Helper exit zero alone does not establish success. Check recorded steps; after snapshots are attempted even after partial failure. Do not repeat inventories, query every tool's --version, run broad discovery or read complete successful logs. Poll only while the helper runs, with sensible waits. Read the relevant log tail on failure or a stalled process.\n\nThe helper locks commands and checkpoints them. research_pending returns the saved run without upgrading again. Use --resume only for established interrupted work; never blindly repeat an update or clear a live lock. For the known symlinked automation-root sandbox initialisation error, avoid repeated doomed calls and use normal require_escalated approval where permitted. A prior approval never overrides a new denial. Do not change sandbox/trust settings or symlinks.\n\nResearch and dotfiles impact\nRead outstanding-findings.json and pending research when present. Preserve historical cask evidence, but mark cask-only findings out_of_scope rather than resolved and exclude cask ranges from active review. Do not recheck or report cask-only findings. changes compares before → after; pending_review compares last reviewed baseline → after, including manual upgrades. Preserve older pending ranges even if today's command changed nothing. If there are no changed versions or pending ranges, skip release searches, config sweeps, plugin-commit checks and repository-review agents. Recheck only relevant outstanding findings; this is not a historical compatibility audit.\n\nDistinguish upstream upgrades from installs, removals, downgrades, linkage, Homebrew rebuilds and old-keg cleanup. Resolve version direction from evidence, not lexical sorting. Use saved metadata and full tap identities. For every actual formula upgrade, including dependencies and manual changes, and Homebrew itself, fetch primary upstream notes/changelogs/migration guides covering EVERY intervening release after the reviewed version through the installed version. Never omit intermediate releases or report uninstalled versions. Reuse sources, batch independent lookups and delegate bounded groups when helpful. Keep unavailable or ambiguous evidence pending. Thorough research does not require mentioning every reviewed package in the report.\n\nFor affected tools, search relevant uses in config/, setup/, Taskfile.yaml and install.sh: aliases, shell setup/completions, scripts and affected Neovim plugins/lockfiles. Inspect live configuration or dependency consumers only when a release gives a concrete reason. Check schema/option/default changes, CLI/API compatibility and runtime requirements with read-only validation where useful. A mandatory migration matters even if the upstream change is small. Identify the exact file/line, obsolete key/command, consequence and smallest correction. Do not infer affected projects from merely having a tool installed. Recommend corrections; do not edit dotfiles.\n\nCheckpoint\nKeep raw snapshots/log and compact current.json, baseline.json, pending ranges and findings in ignored .automation-state/homebrew-daily/. Store only changed/pending package research with covered versions and source URLs. Save completed research in the existing run directory; do not overwrite earlier runs' evidence with today's results. Merge unresolved findings by stable ID, preserving first_seen_at and their last reported cause, version and required action. Resolve them only with evidence. Keep pending ranges distinct from operational failures. No Markdown research notes, state READMEs, duplicate baselines or unchanged-package prose.\n\nUse the helper's atomic_json for state writes. Advance only fully reviewed package entries to the saved after snapshot, preserving full IDs/schema; do this even when nothing merits reporting or another package failed to update. Acknowledge removals, cleanup/link changes and Homebrew similarly without inventing releases. Once research is reviewed or durably queued, mark current.json complete with the true outcome; keep unknown/interrupted execution recoverable. Scheduler memory contains only outcome, state pointer and outstanding work.\n\nFinal report\nUse concise British English and these exact headings, in this order, on every run:\n\n## Dotfiles changes needed\nConfirmed required changes first, marked HIGH PRIORITY, with file/line, consequence and smallest correction. Keep still-open previously reported required migrations concise. Do not put routine application permissions or optional improvements here.\n\n## Features\nOnly meaningful new user capabilities: for example, a useful new CLI command, a substantial new workflow or support that enables previously unavailable work. Each bullet must answer \"What meaningful thing can I now do, and how?\" A new flag is not automatically meaningful. Exclude download resumption/retries, small speed/cache improvements, clipboard conveniences, dependency APIs without a direct consumer, routine packaging and internal refactors/hardening without a major user consequence.\n\n## Fixes (critical)\nONLY critical fixes with primary-source evidence of a severe consequence AND concrete applicability to this platform, configuration or workflow: for example, serious exploitable compromise, data loss/corruption or a major core workflow being unusable. A security label, generic hardening, potential race or the word \"important\" does not establish criticality. Do not recommend blanket project reinstalls without evidence of affected projects. Omit minor bugs, rare edge cases, cosmetic fixes and routine performance regressions. When severity or relevance is unestablished, omit the highlight rather than speculate.\n\nFor each surfaced release change include tool old → new version, the practical benefit/impact and a direct primary-source link. Apply \"Would a friend who uses this tool find this insightful?\" strictly. No changelog dump, quota or filler. An empty section says \"None identified.\" If relevant research is incomplete, say \"Not yet established — review incomplete\" instead of claiming none. Even after upgrades, all three sections may legitimately be empty.\n\nAdd a short ## Run issues section only for failures or research gaps affecting coverage. Unresolved command failures use Command issue with command, cause, impact and required action. Do not hide the failed update or imply full success. Do not repeat resolved/transient failures. Finish with the report itself in this Codex task, not an inbox summary. Do not commit, push, message others or change unrelated settings."
