# Codex may update this baseline when defaults change. Keep credentials, project trust,
# plugin state, and runtime state out of this file. Adjust the download path per machine.
#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-5.6-sol"
model_reasoning_effort = "ultra"

file_opener = "vscode"  # To enable clickable VS Code line citations

web_search = "live"  # Use 'cached' for OpenAI's cached docs

service_tier = "priority"  # Fast mode
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[analytics]
enabled = false

[desktop]
ambient-suggestions-enabled = true
localeOverride = "en-US"
conversationDetailMode = "STEPS_COMMANDS"
preventSleepWhileRunning = true
appearanceLightCodeThemeId = "catppuccin"
appearanceTheme = "dark"
appearanceDarkCodeThemeId = "catppuccin"
usePointerCursors = true
appearanceDiffMarkerStyle = "color"
selected-avatar-id = "codex"
followUpQueueMode = "queue"
dock-icon-preference = "codex-system"
browser-download-directory = "/Users/vl-cr/Desktop"
browser-download-prompt-enabled = true
realtimeVoiceScreenContextEnabled = true
keepRemoteControlAwakeWhilePluggedIn = true

[desktop.open-in-target-preferences]
global = "vscode"

[desktop.appearanceLightChromeTheme]
accent = "#8839ef"
contrast = 45
ink = "#4c4f69"
opaqueWindows = false
surface = "#eff1f5"

[desktop.appearanceLightChromeTheme.fonts]

[desktop.appearanceLightChromeTheme.semanticColors]
diffAdded = "#40a02b"
diffRemoved = "#d20f39"
skill = "#8839ef"

[desktop.appearanceDarkChromeTheme]
accent = "#cba6f7"
contrast = 100
ink = "#cdd6f4"
opaqueWindows = false
surface = "#1e1e2e"

[desktop.appearanceDarkChromeTheme.fonts]

[desktop.appearanceDarkChromeTheme.semanticColors]
diffAdded = "#a6e3a1"
diffRemoved = "#f38ba8"
skill = "#cba6f7"

[features]
js_repl = false
memories = false
chronicle = false

[memories]
generate_memories = false
use_memories = false
