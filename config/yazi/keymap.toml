[[mgr.prepend_keymap]]
on = "<Enter>"
run = "plugin smart-enter"
desc = "Open file in $EDITOR or exit into directory"

[[mgr.prepend_keymap]]
on = "e"
run = "shell --orphan -- code %h"
desc = "Open in VS Code"

[[mgr.prepend_keymap]]
on = "Q"
run = "quit"
desc = "Exit Yazi and change shell directory"

[[mgr.prepend_keymap]]
on = "q"
run = "quit --no-cwd-file"
desc = "Exit Yazi without changing shell directory"
